# Build the Quarto course site (course/) and publish it to GitHub Pages on every push to main that touches it.
# Site: https://ratchainant.github.io/ml-in-action/
name: pages
on:
  push:
    branches: [main]
    paths: ["course/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render course
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/_book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
